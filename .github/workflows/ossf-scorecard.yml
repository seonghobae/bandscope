name: ossf-scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  analysis:
    name: ossf-scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: develop
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: ossf-scorecard-results
          path: results.sarif
          retention-days: 5
  scorecard-sarif-upload:
    name: scorecard-sarif-upload
    needs: analysis
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: develop
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: develop
        with:
          persist-credentials: false
          path: trusted-scorecard-scripts
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ossf-scorecard-results
          path: scorecard-artifact
          skip-decompress: true
      - name: Safely extract Scorecard SARIF artifact
        run: >-
          python3 trusted-scorecard-scripts/scripts/checks/extract_scorecard_artifact.py
          scorecard-artifact
          scorecard-sarif
      - name: Normalize repository-level Scorecard SARIF locations
        run: >-
          python3 trusted-scorecard-scripts/scripts/checks/normalize_scorecard_sarif.py
          scorecard-sarif/results.sarif
          normalized-scorecard-results.sarif
      - uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0 peeled commit; SHA pinning retained as supply-chain attack mitigation.
        with:
          sarif_file: normalized-scorecard-results.sarif
